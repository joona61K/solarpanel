version: '3.9'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: hems-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/hems.db
      - Hems__InverterUrl=http://192.168.1.100
      - Hems__SpotPriceArea=FI
      - Hems__WeatherLatitude=60.17
      - Hems__WeatherLongitude=24.94
      - Hems__ShellyBaseUrl=http://192.168.1.200
      - Hems__SurplusThresholdWatts=500
      - Hems__CheapPriceThresholdEur=0.05
      - Hems__ExpensivePriceThresholdEur=0.20
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/energy/readings/latest"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: hems-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
